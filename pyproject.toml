[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "latedeliveries"
version = "0.1.0"
description = "QuickBite late-order prediction with cost-based thresholds"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 88
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
